name: Release
run-name: Release ${{ inputs.bump }} from next by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for every changed package
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-next
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/astro install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm benchmark

  visual:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          for example in examples/*; do
            pnpm --dir "$example" install --no-frozen-lockfile
          done
      - run: pnpm --dir tests exec playwright install chromium
      - run: pnpm test:visual

  release:
    needs:
      - verify
      - visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: next
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs plan --base origin/main --bump "$BUMP" --output "$RUNNER_TEMP/release-plan.json"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Apply and commit versions
        if: steps.plan.outputs.has-release == 'true'
        run: |
          node scripts/release-plan.mjs apply --input "$RUNNER_TEMP/release-plan.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/*/package.json
          git commit -m "chore(release): publish $BUMP releases"
          git push origin HEAD:next
        env:
          BUMP: ${{ inputs.bump }}
      - name: Verify the release commit
        run: |
          release_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref next
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow ci.yml --commit "$release_sha" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          [ -n "$run_id" ] || { printf 'Timed out waiting for CI on %s\n' "$release_sha" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install release dependencies
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check release versions are available
        if: steps.plan.outputs.has-release == 'true'
        run: |
          while IFS=$'\t' read -r package version tag; do
            if pnpm view "$package@$version" version >/dev/null 2>&1; then
              printf '%s@%s is already published\n' "$package" "$version" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              printf 'Tag %s already exists\n' "$tag" >&2
              exit 1
            fi
          done < <(jq -r '.packages[] | [.name, .nextVersion, .tag] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Build release packages
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm build
      - name: Publish packages
        if: steps.plan.outputs.has-release == 'true'
        run: |
          while IFS= read -r package; do
            pnpm --filter "$package" publish --access public --no-git-checks --provenance
          done < <(jq -r '.packages[].name' "$RUNNER_TEMP/release-plan.json")
      - name: Tag published packages
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_sha="$(git rev-parse HEAD)"
          while IFS= read -r tag; do
            git tag --annotate "$tag" "$release_sha" --message "Release $tag"
            git push origin "$tag"
          done < <(jq -r '.packages[].tag' "$RUNNER_TEMP/release-plan.json")
      - name: Create GitHub Release
        if: steps.plan.outputs.has-release == 'true'
        run: |
          first_tag="$(jq -r '.packages[0].tag' "$RUNNER_TEMP/release-plan.json")"
          jq -r '"## Published packages\n\n" + (.packages | map("- `\(.name)@\(.nextVersion)` ([tag](https://github.com/" + env.GITHUB_REPOSITORY + "/releases/tag/" + .tag + "))") | join("\n"))' "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$first_tag" --title "Release $first_tag" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create and auto-merge the release PR
        run: |
          pr_url="$(gh pr list --base main --head next --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head next --title 'Release next to main' --body 'Automated release merge from next.')"
          fi
          gh pr merge "$pr_url" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
