name: Prepare package versions
run-name: Prepare ${{ inputs.bump }} package versions from main by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for changed packages
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: prepare-package-versions-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Plan changed package versions
        id: plan
        run: |
          node scripts/release-plan.mjs plan --package auto --bump "$BUMP" --output "$RUNNER_TEMP/release-plan.json"
          if [ "$(jq '.packages | length' "$RUNNER_TEMP/release-plan.json")" -eq 0 ]; then
            echo "No changed packages need a version bump."
            echo "No packages changed since their latest release tags; no version PR was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Planned package versions"
            jq -r '.packages[] | "- \(.name): \(.version) → \(.nextVersion)"' "$RUNNER_TEMP/release-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Check planned versions are unpublished
        if: steps.plan.outputs.has-release == 'true'
        run: |
          npm_version_is_published() {
            local package="$1"
            local version="$2"
            local package_path="${package//\//%2f}"
            local status

            if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --output "$RUNNER_TEMP/npm-package-metadata.json" --write-out '%{http_code}' "https://registry.npmjs.org/$package_path")"; then
              printf 'Could not query npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            if [ "$status" = 404 ]; then return 1; fi
            if [ "$status" != 200 ]; then
              printf 'npm returned HTTP %s while querying %s\n' "$status" "$package" >&2
              return 2
            fi
            if ! jq -e 'type == "object" and (.versions | type == "object")' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null; then
              printf 'Unexpected npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            jq -e --arg version "$version" '.versions | has($version)' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null
          }

          vscode_version_is_published() {
            local extension_id="$1"
            local version="$2"
            local metadata

            if ! metadata="$(pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce@4.0.0 show "$extension_id" --json)"; then
              printf 'Could not query Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            if [ "$metadata" = undefined ]; then return 1; fi
            if ! jq -e 'type == "object" and (.versions | type == "array")' <<< "$metadata" >/dev/null; then
              printf 'Unexpected Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            jq -e --arg version "$version" 'any(.versions[]?; .version == $version)' <<< "$metadata" >/dev/null
          }

          while IFS=$'\t' read -r package version tag registry directory; do
            case "$registry" in
              npm)
                if npm_version_is_published "$package" "$version"; then
                  printf '%s@%s is already published to npm\n' "$package" "$version" >&2
                  exit 1
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then
                    printf 'Could not check whether %s@%s is published\n' "$package" "$version" >&2
                    exit "$query_status"
                  fi
                fi
                ;;
              vscode)
                extension_id="$(jq -er '.publisher + "." + .name' "$directory/package.json")"
                if vscode_version_is_published "$extension_id" "$version"; then
                  printf '%s@%s is already published to Visual Studio Marketplace\n' "$extension_id" "$version" >&2
                  exit 1
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then exit "$query_status"; fi
                fi
                ;;
              *)
                printf 'Unknown release registry %s for %s\n' "$registry" "$package" >&2
                exit 1
                ;;
            esac
            if ! tag_refs="$(git ls-remote --tags origin "refs/tags/$tag")"; then
              printf 'Could not query remote tags for %s\n' "$tag" >&2
              exit 1
            fi
            if [ -n "$tag_refs" ]; then
              printf 'Release tag %s already exists\n' "$tag" >&2
              exit 1
            fi
          done < <(jq -r '.packages[] | [.name, .nextVersion, .tag, (.registry // "npm"), .directory] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Create version-preparation App token
        if: steps.plan.outputs.has-release == 'true'
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Apply planned versions and create branch
        if: steps.plan.outputs.has-release == 'true'
        run: |
          node scripts/release-plan.mjs apply --input "$RUNNER_TEMP/release-plan.json"
          pnpm install --no-frozen-lockfile --config.link-workspace-packages=true
          pnpm exec prettier pnpm-lock.yaml --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          version_branch="versions/$BUMP-$GITHUB_RUN_ID"
          git switch --create "$version_branch"
          git add pnpm-lock.yaml packages/*/package.json examples/*/package.json
          git commit -m "chore(release): prepare $BUMP package versions"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$version_branch"
          printf 'version-branch=%s\n' "$version_branch" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TOKEN: ${{ steps.app_token.outputs.token }}
      - name: Create version-preparation PR
        if: steps.plan.outputs.has-release == 'true'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION_BRANCH: versions/${{ inputs.bump }}-${{ github.run_id }}
        run: |
          {
            echo "## Prepared package versions"
            jq -r '.packages[] | "- \(.name): \(.version) → \(.nextVersion)"' "$RUNNER_TEMP/release-plan.json"
            echo
            echo "This workflow selected packages changed since their latest release tags and validated that each planned version is unpublished and untagged."
            echo "Merge this PR after its required checks pass. Once main CI is green, dispatch **Release packages** to publish these versions."
          } > "$RUNNER_TEMP/version-pr-body.md"
          gh pr create \
            --base main \
            --head "$VERSION_BRANCH" \
            --title "chore(release): prepare $BUMP package versions" \
            --body-file "$RUNNER_TEMP/version-pr-body.md"
