name: Prepare package versions
run-name: Prepare ${{ inputs.bump }} package versions by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for changed packages
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      pr_id:
        description: Optional open same-repository PR number; prepare versions on its branch so one PR CI run checks both changes.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prepare-package-versions-${{ inputs.pr_id || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
      - name: Resolve target branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ inputs.pr_id }}
          BUMP: ${{ inputs.bump }}
        run: node scripts/prepare-package-versions/resolve-target.mjs
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to target branch
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: git switch --create "$TARGET_BRANCH" "$TARGET_SHA"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Load trusted release planner
        env:
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: git show "$TRUSTED_MAIN_SHA:scripts/release-plan.mjs" > scripts/.release-plan-trusted.mjs
      - name: Plan changed package versions
        id: plan
        run: node scripts/prepare-package-versions/plan.mjs
        env:
          BUMP: ${{ inputs.bump }}
          PR_ID: ${{ inputs.pr_id }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BASE_SHA: ${{ steps.target.outputs.base-sha }}
          RELEASE_PLANNER: scripts/.release-plan-trusted.mjs
          RELEASE_PLAN_OUTPUT: ${{ runner.temp }}/release-plan.json
      - name: Check planned versions are unpublished
        if: steps.plan.outputs.has-release == 'true'
        run: node scripts/prepare-package-versions/validate.mjs
        env:
          RELEASE_PLAN_INPUT: ${{ runner.temp }}/release-plan.json
      - name: Apply planned versions and update lockfile
        if: steps.plan.outputs.has-release == 'true'
        run: node scripts/prepare-package-versions/apply.mjs
        env:
          RELEASE_PLAN_INPUT: ${{ runner.temp }}/release-plan.json
          RELEASE_PLANNER: scripts/.release-plan-trusted.mjs
      - name: Create version-preparation App token
        if: steps.plan.outputs.has-release == 'true'
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit and push prepared versions
        if: steps.plan.outputs.has-release == 'true'
        run: |
          rm -f scripts/.release-plan-trusted.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml packages/*/package.json examples/*/package.json
          git -c core.hooksPath=/dev/null commit -m "chore(release): prepare $BUMP package versions"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$TARGET_BRANCH"
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
      - name: Report prepared versions on requested PR
        if: steps.plan.outputs.has-release == 'true' && inputs.pr_id != ''
        env:
          PR_ID: ${{ inputs.pr_id }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          echo "Prepared package versions were committed to PR #$PR_ID on branch $TARGET_BRANCH. Its regular PR CI now checks both the source changes and prepared versions together." >> "$GITHUB_STEP_SUMMARY"
      - name: Create version-preparation PR
        if: steps.plan.outputs.has-release == 'true' && inputs.pr_id == ''
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          {
            echo "## Prepared package versions"
            jq -r '.packages[] | "- \(.name): \(.version) → \(.nextVersion)"' "$RUNNER_TEMP/release-plan.json"
            echo
            echo "This workflow selected packages changed since their latest release tags and validated that each planned version is unpublished and untagged."
            echo "Merge this PR after its required checks pass, then dispatch **Release packages** to publish these versions."
          } > "$RUNNER_TEMP/version-pr-body.md"
          gh pr create \
            --base main \
            --head "$VERSION_BRANCH" \
            --title "chore(release): prepare $BUMP package versions" \
            --body-file "$RUNNER_TEMP/version-pr-body.md"
