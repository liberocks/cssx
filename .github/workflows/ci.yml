name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  platforms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: electron
            command: xvfb-run --auto-servernum pnpm test
          - example: react-native
            command: pnpm test
          - example: expo
            command: pnpm test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile
        working-directory: examples/${{ matrix.example }}
      - if: matrix.example == 'electron'
        run: |
          ELECTRON_RUN_AS_NODE=1 pnpm --dir examples/electron exec electron --version
          CSSX_ELECTRON_SANDBOX="$(readlink -f examples/electron/node_modules/electron/dist/chrome-sandbox)"
          sudo chown root:root "$CSSX_ELECTRON_SANDBOX"
          sudo chmod 4755 "$CSSX_ELECTRON_SANDBOX"
      - run: ${{ matrix.command }}
        working-directory: examples/${{ matrix.example }}

  web-frameworks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework: [astro, gatsby, next, react, vite, remix, solid]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm install --no-frozen-lockfile
        working-directory: examples/${{ matrix.framework }}
      - if: runner.os == 'Linux'
        run: pnpm --dir tests exec playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: pnpm --dir tests exec playwright install chromium
      - run: node tests/scripts/run-framework-test.mjs ${{ matrix.framework }} development
        env:
          # Snapshot baselines are refreshed on the matching hosted OS in
          # visual-baselines.yml, then reviewed and committed separately.
          CSSX_VISUAL_SCREENSHOTS: '0'
      - run: node tests/scripts/run-framework-test.mjs ${{ matrix.framework }} production
        env:
          CSSX_VISUAL_SCREENSHOTS: '0'
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ matrix.os }}-${{ matrix.framework }}-artifacts
          path: |
            tests/test-results
            examples/${{ matrix.framework }}/.next
            examples/${{ matrix.framework }}/dist
          if-no-files-found: ignore

  package-managers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.manager == 'yarn'
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: node tests/scripts/packed-consumer.mjs ${{ matrix.manager }}

  electron:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm install --frozen-lockfile
        working-directory: examples/electron
      - if: runner.os == 'Linux'
        run: |
          ELECTRON_RUN_AS_NODE=1 pnpm --dir examples/electron exec electron --version
          CSSX_ELECTRON_SANDBOX="$(readlink -f examples/electron/node_modules/electron/dist/chrome-sandbox)"
          sudo chown root:root "$CSSX_ELECTRON_SANDBOX"
          sudo chmod 4755 "$CSSX_ELECTRON_SANDBOX"
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test
        working-directory: examples/electron
      - if: runner.os != 'Linux'
        run: pnpm test
        working-directory: examples/electron

  react-native-bundles:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm install --frozen-lockfile
        working-directory: examples/react-native
      - run: pnpm test
        working-directory: examples/react-native

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/astro install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm benchmark
