name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options: [deploy-production, deploy-preview, cleanup-preview]
      preview_name:
        description: Required for preview actions; lowercase letters, digits, and hyphens only
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: inputs.action != 'cleanup-preview'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTION: ${{ inputs.action }}
      PREVIEW_NAME: ${{ inputs.preview_name }}
      REF: ${{ github.ref }}
    steps:
      - name: Validate deployment request
        run: |
          if [ "$ACTION" = deploy-production ] && [ "$REF" != refs/heads/main ]; then
            printf '%s\n' 'Production documentation can be deployed only from main.' >&2
            exit 1
          fi
          if [ "$ACTION" = deploy-preview ] && ! [[ "$PREVIEW_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            printf '%s\n' 'Preview names must contain lowercase letters, digits, and single hyphens.' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy documentation
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ inputs.action == 'deploy-production' && 'deploy' || format('deploy --name cssx-docs-preview-{0}', inputs.preview_name) }}
          workingDirectory: packages/docs
          gitHubToken: ${{ github.token }}

  cleanup-preview:
    if: inputs.action == 'cleanup-preview'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: ${{ inputs.preview_name }}
    steps:
      - name: Validate and delete preview
        run: |
          if ! [[ "$PREVIEW_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            printf '%s\n' 'Preview names must contain lowercase letters, digits, and single hyphens.' >&2
            exit 1
          fi
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: delete cssx-docs-preview-${{ inputs.preview_name }} --force
