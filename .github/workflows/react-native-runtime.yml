name: React Native runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: read

concurrency:
  group: react-native-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  CSSX_RN_HOST: tests/.tmp/CssxNativeHarness

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm dlx @react-native-community/cli@20.2.0 init CssxNativeHarness --version 0.87.1 --skip-install --directory "$CSSX_RN_HOST"
      - run: node tests/scripts/prepare-react-native-host.mjs "$CSSX_RN_HOST"
      - run: pnpm install --no-frozen-lockfile
        working-directory: ${{ env.CSSX_RN_HOST }}
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            cd "$CSSX_RN_HOST"
            pnpm start -- --port 8081 > "$RUNNER_TEMP/cssx-metro.log" 2>&1 &
            pnpm exec react-native run-android --no-packager
            adb shell am force-stop com.cssxnativeharness
            adb shell monkey -p com.cssxnativeharness 1
            sleep 15
            adb exec-out uiautomator dump /dev/tty | grep -F 'Vanilla React Native'
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-native-android-logs
          path: ${{ runner.temp }}/cssx-metro.log
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm dlx @react-native-community/cli@20.2.0 init CssxNativeHarness --version 0.87.1 --skip-install --directory "$CSSX_RN_HOST"
      - run: node tests/scripts/prepare-react-native-host.mjs "$CSSX_RN_HOST"
      - run: pnpm install --no-frozen-lockfile
        working-directory: ${{ env.CSSX_RN_HOST }}
      - run: pod install
        working-directory: ${{ env.CSSX_RN_HOST }}/ios
      - run: |
          cd "$CSSX_RN_HOST"
          pnpm start -- --port 8081 > "$RUNNER_TEMP/cssx-metro.log" 2>&1 &
          pnpm exec react-native run-ios --simulator 'iPhone 16' --no-packager
          xcrun simctl launch booted com.cssxnativeharness
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-native-ios-logs
          path: ${{ runner.temp }}/cssx-metro.log
          if-no-files-found: ignore
