name: Release packages
run-name: Release prepared packages (${{ inputs.package }}) from main by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Changed packages to publish, or one package to finish a partial release
        required: true
        type: choice
        default: auto
        options:
          - auto
          - '@cssxio/compiler'
          - '@cssxio/compiler-native'
          - '@cssxio/babel-plugin'
          - '@cssxio/cssx'
          - '@cssxio/html'
          - '@cssxio/react-native'
          - '@cssxio/unplugin'
          - cssx-intellisense
      release_sha:
        description: Original main commit for a partial-release retry; leave empty for current main
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release-sha: ${{ steps.validate.outputs.release-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release commit
        id: validate
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          release_sha="${REQUESTED_RELEASE_SHA,,}"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'release_sha must be a full 40-character commit SHA\n' >&2
            exit 1
          fi
          git fetch origin main
          if ! git cat-file -e "$release_sha^{commit}"; then
            printf 'Release commit %s is not available in this repository\n' "$release_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            printf 'Release commit %s is not reachable from main\n' "$release_sha" >&2
            exit 1
          fi
          printf 'release-sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'Publishing from commit %s.\n' "$release_sha" >> "$GITHUB_STEP_SUMMARY"

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-native, validate]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Select validated release commit
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release-sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: compiler-native-*
          path: packages/compiler-native/native
          merge-multiple: true
      - run: node scripts/assert-native-package.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/astro install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm benchmark

  build-native:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            library: packages/compiler/native/target/release/libcssx_compiler_node.so
            binary: cssx_compiler_node.linux-x64.node
          - os: macos-15
            platform: darwin-arm64
            library: packages/compiler/native/target/release/libcssx_compiler_node.dylib
            binary: cssx_compiler_node.darwin-arm64.node
          - os: windows-latest
            platform: win32-x64
            library: packages/compiler/native/target/release/cssx_compiler_node.dll
            binary: cssx_compiler_node.win32-x64.node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select validated release commit
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release-sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the native compiler
        run: cargo +1.99.1 build --manifest-path packages/compiler/native/Cargo.toml --release -p cssx-compiler-node
        env:
          CARGO_BUILD_JOBS: 2
        shell: bash
      - name: Stage platform binary
        run: |
          mkdir -p packages/compiler-native/native
          cp "${{ matrix.library }}" "packages/compiler-native/native/${{ matrix.binary }}"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiler-native-${{ matrix.platform }}
          path: packages/compiler-native/native/${{ matrix.binary }}
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [verify, build-native, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          # Release branch and tag pushes must authenticate with RELEASE_TOKEN,
          # not the read-only workflow GITHUB_TOKEN persisted by checkout.
          persist-credentials: false
      - name: Select validated release commit
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.release-sha }}
        run: git checkout --detach "$RELEASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: compiler-native-*
          path: packages/compiler-native/native
          merge-multiple: true
      - name: Verify native package artifacts
        run: node scripts/assert-native-package.mjs
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # npm trusted publishing requires npm 11.5.1+, supplied by Node 24.
          node-version: 24.22.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Plan prepared package release
        id: plan
        run: node scripts/release-plan.mjs plan --package "$PACKAGE" --bump patch --retry-existing-version true --output "$RUNNER_TEMP/release-plan.json"
        env:
          PACKAGE: ${{ inputs.package }}
      - name: Create release GitHub App token
        if: steps.plan.outputs.has-release == 'true'
        id: release_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Install release dependencies
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check release versions can be finalized
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          npm_version_is_published() {
            local package="$1"
            local version="$2"
            local package_path="${package//\//%2f}"
            local status

            if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --output "$RUNNER_TEMP/npm-package-metadata.json" --write-out '%{http_code}' "https://registry.npmjs.org/$package_path")"; then
              printf 'Could not query npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            if [ "$status" = 404 ]; then return 1; fi
            if [ "$status" != 200 ]; then
              printf 'npm returned HTTP %s while querying %s\n' "$status" "$package" >&2
              return 2
            fi
            if ! jq -e 'type == "object" and (.versions | type == "object")' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null; then
              printf 'Unexpected npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            jq -e --arg version "$version" '.versions | has($version)' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null
          }

          vscode_version_is_published() {
            local extension_id="$1"
            local version="$2"
            local metadata

            if ! metadata="$(pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce@4.0.0 show "$extension_id" --json)"; then
              printf 'Could not query Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            if [ "$metadata" = undefined ]; then return 1; fi
            if ! jq -e 'type == "object" and (.versions | type == "array")' <<< "$metadata" >/dev/null; then
              printf 'Unexpected Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            jq -e --arg version "$version" 'any(.versions[]?; .version == $version)' <<< "$metadata" >/dev/null
          }

          while IFS=$'\t' read -r package version tag registry directory; do
            package_is_published=false
            case "$registry" in
              npm)
                if npm_version_is_published "$package" "$version"; then
                  package_is_published=true
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then exit "$query_status"; fi
                fi
                ;;
              vscode)
                extension_id="$(jq -er '.publisher + "." + .name' "$directory/package.json")"
                if vscode_version_is_published "$extension_id" "$version"; then
                  package_is_published=true
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then exit "$query_status"; fi
                fi
                ;;
              *)
                printf 'Unknown release registry %s for %s\n' "$registry" "$package" >&2
                exit 1
                ;;
            esac
            if [ "$package_is_published" = true ]; then
              if [ "$release_mode" != retry ]; then
                printf '%s@%s is already published to %s\n' "$package" "$version" "$registry" >&2
                exit 1
              fi
              printf '%s@%s is already published; retry will create its missing package tag and update its commit release\n' "$package" "$version"
            fi
            if ! tag_refs="$(git ls-remote --tags origin "refs/tags/$tag")"; then
              printf 'Could not query remote tags for %s\n' "$tag" >&2
              exit 1
            fi
            if [ -n "$tag_refs" ]; then
              if [ "$release_mode" != retry ]; then
                printf 'Tag %s already exists\n' "$tag" >&2
                exit 1
              fi
              printf 'Tag %s already exists; retry will check its GitHub Release\n' "$tag"
            fi
          done < <(jq -r '.packages[] | [.name, .nextVersion, .tag, (.registry // "npm"), .directory] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Build release packages
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm build
      - name: Publish packages
        if: steps.plan.outputs.has-release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          npm_version_is_published() {
            local package="$1"
            local version="$2"
            local package_path="${package//\//%2f}"
            local status

            if ! status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --output "$RUNNER_TEMP/npm-package-metadata.json" --write-out '%{http_code}' "https://registry.npmjs.org/$package_path")"; then
              printf 'Could not query npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            if [ "$status" = 404 ]; then return 1; fi
            if [ "$status" != 200 ]; then
              printf 'npm returned HTTP %s while querying %s\n' "$status" "$package" >&2
              return 2
            fi
            if ! jq -e 'type == "object" and (.versions | type == "object")' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null; then
              printf 'Unexpected npm version metadata for %s\n' "$package" >&2
              return 2
            fi
            jq -e --arg version "$version" '.versions | has($version)' "$RUNNER_TEMP/npm-package-metadata.json" >/dev/null
          }

          vscode_version_is_published() {
            local extension_id="$1"
            local version="$2"
            local metadata

            if ! metadata="$(pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce@4.0.0 show "$extension_id" --json)"; then
              printf 'Could not query Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            if [ "$metadata" = undefined ]; then return 1; fi
            if ! jq -e 'type == "object" and (.versions | type == "array")' <<< "$metadata" >/dev/null; then
              printf 'Unexpected Visual Studio Marketplace metadata for %s\n' "$extension_id" >&2
              return 2
            fi
            jq -e --arg version "$version" 'any(.versions[]?; .version == $version)' <<< "$metadata" >/dev/null
          }

          while IFS=$'\t' read -r package version registry directory; do
            case "$registry" in
              npm)
                if npm_version_is_published "$package" "$version"; then
                  if [ "$release_mode" != retry ]; then
                    printf '%s@%s is already published\n' "$package" "$version" >&2
                    exit 1
                  fi
                  printf 'Skipping already-published %s@%s\n' "$package" "$version"
                  continue
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then exit "$query_status"; fi
                fi
                pnpm --filter "$package" publish --access public --no-git-checks --provenance
                ;;
              vscode)
                extension_id="$(jq -er '.publisher + "." + .name' "$directory/package.json")"
                if vscode_version_is_published "$extension_id" "$version"; then
                  if [ "$release_mode" != retry ]; then
                    printf '%s@%s is already published\n' "$package" "$version" >&2
                    exit 1
                  fi
                  printf 'Skipping already-published %s@%s\n' "$package" "$version"
                  continue
                else
                  query_status=$?
                  if [ "$query_status" -gt 1 ]; then exit "$query_status"; fi
                fi
                if [ -z "$VSCE_PAT" ]; then
                  printf 'Missing repository secret VSCE_PAT required to publish %s\n' "$extension_id" >&2
                  exit 1
                fi
                if [ "$release_mode" = retry ]; then
                  (cd "$directory" && pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce@4.0.0 publish --no-dependencies --skip-duplicate)
                else
                  (cd "$directory" && pnpm dlx --allow-build=@vscode/vsce-sign @vscode/vsce@4.0.0 publish --no-dependencies)
                fi
                ;;
              *)
                printf 'Unknown release registry %s for %s\n' "$registry" "$package" >&2
                exit 1
                ;;
            esac
          done < <(jq -r '.packages[] | [.name, .nextVersion, (.registry // "npm"), .directory] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Tag published packages
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          release_sha="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while IFS= read -r tag; do
            if ! tag_refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"; then
              printf 'Could not query remote tags for %s\n' "$tag" >&2
              exit 1
            fi
            tag_ref="$(awk -v ref="refs/tags/$tag" '$2 == ref { print $1; exit }' <<< "$tag_refs")"
            if [ -n "$tag_ref" ]; then
              if [ "$release_mode" != retry ]; then
                printf 'Tag %s already exists\n' "$tag" >&2
                exit 1
              fi
              tag_commit="$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1; exit }' <<< "$tag_refs")"
              tag_commit="${tag_commit:-$tag_ref}"
              if [ "$tag_commit" != "$release_sha" ]; then
                printf 'Tag %s points to %s, not release commit %s\n' "$tag" "$tag_commit" "$release_sha" >&2
                exit 1
              fi
              printf 'Skipping existing tag %s\n' "$tag"
              continue
            fi
            git tag --annotate "$tag" "$release_sha" --message "Release $tag"
            git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$tag"
          done < <(jq -r '.packages[].tag' "$RUNNER_TEMP/release-plan.json")
        env:
          RELEASE_TOKEN: ${{ steps.release_app_token.outputs.token }}
      - name: Create or update GitHub Release
        if: steps.plan.outputs.has-release == 'true'
        run: |
          git fetch --tags origin
          release_sha="$(git rev-parse HEAD)"
          release_short_sha="${release_sha:0:7}"
          release_tag="release-$release_sha"
          first_package="$(jq -r '.packages[0].name' "$RUNNER_TEMP/release-plan.json")"
          first_package_tag="$(jq -r '.packages[0].tag' "$RUNNER_TEMP/release-plan.json")"

          published_packages="$({
            for manifest_path in packages/*/package.json; do
              package_name="$(jq -r 'select(.private != true) | .name // empty' "$manifest_path")"
              package_version="$(jq -r 'select(.private != true) | .version // empty' "$manifest_path")"
              if [ -z "$package_name" ] || [ -z "$package_version" ]; then continue; fi

              package_tag="$package_name@$package_version"
              package_sha="$(git rev-list -n 1 "refs/tags/$package_tag" 2>/dev/null || true)"
              if [ "$package_sha" = "$release_sha" ]; then
                jq -cn \
                  --arg name "$package_name" \
                  --arg version "$package_version" \
                  --arg tag "$package_tag" \
                  '{ name: $name, version: $version, tag: $tag }'
              fi
            done
          } | jq -s 'sort_by(.name)')"

          package_count="$(jq 'length' <<< "$published_packages")"
          if [ "$package_count" -eq 0 ]; then
            printf 'No published package tags point to release commit %s\n' "$release_sha" >&2
            exit 1
          fi

          release_title="$(
            jq -r \
              --arg short_sha "$release_short_sha" \
              '"Release " + $short_sha + ": " + (map(.name + "@" + .version) | join(", "))' \
              <<< "$published_packages"
          )"
          jq -r \
            '"## Published packages\n\n" + (map("- `\(.name)@\(.version)` (package tag `\(.tag)`)") | join("\n"))' \
            <<< "$published_packages" > "$RUNNER_TEMP/release-notes.md"

          previous_tag="$(git tag --list "$first_package@*" --sort=-v:refname | grep -Fvx "$first_package_tag" | head -n 1 || true)"
          if [ -z "$previous_tag" ] && git rev-parse --verify --quiet refs/tags/release-baseline >/dev/null; then
            previous_tag=release-baseline
          fi
          if [ -n "$previous_tag" ]; then
            printf '\n## Changes since `%s`\n\n' "$previous_tag" >> "$RUNNER_TEMP/release-notes.md"
            commit_range="$previous_tag..$release_sha"
          else
            printf '\n## Changes\n\n' >> "$RUNNER_TEMP/release-notes.md"
            commit_range="$release_sha"
          fi
          commit_count=0
          while IFS=$'\t' read -r commit subject; do
            printf -- '- [`%.7s`](https://github.com/%s/commit/%s) %s\n' "$commit" "$GITHUB_REPOSITORY" "$commit" "$subject" >> "$RUNNER_TEMP/release-notes.md"
            commit_count=$((commit_count + 1))
          done < <(git log --first-parent --format='%H%x09%s' "$commit_range")
          if [ "$commit_count" -eq 0 ]; then
            printf '%s\n' '- No commits were merged in this release range.' >> "$RUNNER_TEMP/release-notes.md"
          fi

          existing_release_tag=''
          while IFS= read -r candidate_tag; do
            candidate_sha="$(git rev-list -n 1 "refs/tags/$candidate_tag" 2>/dev/null || true)"
            if [ "$candidate_sha" != "$release_sha" ]; then continue; fi
            existing_release_tag="$candidate_tag"
            if [ "$candidate_tag" = "$release_tag" ]; then break; fi
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          if [ -n "$existing_release_tag" ]; then
            gh release edit "$existing_release_tag" \
              --tag "$release_tag" \
              --target "$release_sha" \
              --title "$release_title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            printf 'Updated GitHub Release for commit %s (was tagged %s)\n' "$release_sha" "$existing_release_tag"
          else
            gh release create "$release_tag" \
              --target "$release_sha" \
              --title "$release_title" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
