name: npm-release
run-name: npm-release ${{ inputs.package }} (${{ inputs.bump }}) from main by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: npm package to release, or auto to release every changed package
        required: true
        type: choice
        default: auto
        options:
          - auto
          - '@cssxio/compiler'
          - '@cssxio/babel-plugin'
          - '@cssxio/cssx'
          - '@cssxio/html'
          - '@cssxio/react-native'
          - '@cssxio/unplugin'
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      retry_existing_version:
        description: Retry the current version for one explicitly selected package
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-main
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir examples/astro install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm benchmark

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          # Release branch and tag pushes must authenticate with RELEASE_TOKEN,
          # not the read-only workflow GITHUB_TOKEN persisted by checkout.
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # npm trusted publishing requires npm 11.5.1+, supplied by Node 24.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Plan npm release
        id: plan
        run: node scripts/release-plan.mjs plan --package "$PACKAGE" --bump "$BUMP" --retry-existing-version "$RETRY_EXISTING_VERSION" --output "$RUNNER_TEMP/release-plan.json"
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGE: ${{ inputs.package }}
          RETRY_EXISTING_VERSION: ${{ inputs.retry_existing_version }}
      - name: Create release GitHub App token
        if: steps.plan.outputs.has-release == 'true'
        id: release_app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Apply and commit release versions
        if: steps.plan.outputs.requires-version-bump == 'true'
        id: release_commit
        run: |
          node scripts/release-plan.mjs apply --input "$RUNNER_TEMP/release-plan.json"
          pnpm install --no-frozen-lockfile --config.link-workspace-packages=true
          pnpm exec prettier pnpm-lock.yaml --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          release_branch="release/$BUMP-$GITHUB_RUN_ID"
          git switch --create "$release_branch"
          git add pnpm-lock.yaml packages/*/package.json examples/*/package.json
          git commit -m "chore(release): publish $BUMP releases"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$release_branch"
          printf 'release-branch=%s\n' "$release_branch" >> "$GITHUB_OUTPUT"
          printf 'release-sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TOKEN: ${{ steps.release_app_token.outputs.token }}
      - name: Create and merge the release PR
        if: steps.plan.outputs.requires-version-bump == 'true'
        id: release_pr
        run: |
          merge_release_pr() {
            gh pr merge "$release_pr_number" --squash --delete-branch
          }

          release_pr="$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): publish $BUMP releases" \
            --body "Automated release version bump. The release App is the only actor allowed to bypass protected checks when merging this PR.")"
          release_pr_number="$(gh pr view "$release_pr" --json number --jq '.number')"

          attempts_remaining=360
          while [ "$attempts_remaining" -gt 0 ]; do
            if merge_release_pr; then break; fi

            release_pr_status="$(gh pr view "$release_pr_number" --json state,mergeStateStatus --jq '[.state, .mergeStateStatus] | @tsv')"
            release_state="${release_pr_status%%$'\t'*}"
            merge_state="${release_pr_status#*$'\t'}"
            if [ "$release_state" = MERGED ]; then break; fi
            if [ "$release_state" = CLOSED ]; then
              printf 'Release PR %s was closed without merging\n' "$release_pr_number" >&2
              exit 1
            fi
            if [ "$merge_state" = BEHIND ]; then
              gh pr update-branch "$release_pr_number"
            fi
            sleep 5
            attempts_remaining=$((attempts_remaining - 1))
          done
          release_sha="$(gh pr view "$release_pr_number" --json mergeCommit --jq '.mergeCommit.oid')"
          [ -n "$release_sha" ] || { printf 'Timed out waiting for release PR %s to merge\n' "$release_pr_number" >&2; exit 1; }
          printf 'release-sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.release_commit.outputs.release-branch }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.release-sha }}
      - name: Select the release commit
        if: steps.plan.outputs.has-release == 'true'
        id: release_source
        run: |
          release_sha="$MERGED_RELEASE_SHA"
          if [ "$REQUIRES_VERSION_BUMP" = false ]; then
            manifest_path="$(jq -r '.packages[0].directory + "/package.json"' "$RUNNER_TEMP/release-plan.json")"
            release_version="$(jq -r '.packages[0].nextVersion' "$RUNNER_TEMP/release-plan.json")"
            while IFS= read -r candidate_sha; do
              candidate_version="$(git show "$candidate_sha:$manifest_path" | jq -r '.version')"
              parent_version="$(git show "$candidate_sha^:$manifest_path" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"
              if [ "$candidate_version" = "$release_version" ] && [ "$parent_version" != "$release_version" ]; then
                release_sha="$candidate_sha"
                break
              fi
            done < <(git log --format=%H -- "$manifest_path")
          fi
          [ -n "$release_sha" ] || { printf 'No release commit was selected\n' >&2; exit 1; }
          printf 'release-sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
        env:
          MERGED_RELEASE_SHA: ${{ steps.release_pr.outputs.release-sha }}
          REQUIRES_VERSION_BUMP: ${{ steps.plan.outputs.requires-version-bump }}
      - name: Verify the merged release commit
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_sha="$RELEASE_SHA"
          git fetch origin main
          git checkout "$release_sha"
          attempts_remaining=120
          while [ "$attempts_remaining" -gt 0 ]; do
            run_id="$(gh run list --workflow ci.yml --commit "$release_sha" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then break; fi
            sleep 5
            attempts_remaining=$((attempts_remaining - 1))
          done
          [ -n "$run_id" ] && [ "$run_id" != 'null' ] || { printf 'Timed out waiting for push CI on %s\n' "$release_sha" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
          RELEASE_SHA: ${{ steps.release_source.outputs.release-sha }}
      - name: Install release dependencies
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check release versions can be finalized
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          while IFS=$'\t' read -r package version tag; do
            if pnpm view "$package@$version" version >/dev/null 2>&1; then
              if [ "$release_mode" != retry ]; then
                printf '%s@%s is already published\n' "$package" "$version" >&2
                exit 1
              fi
              printf '%s@%s is already published; retry will create its missing tag and GitHub Release\n' "$package" "$version"
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              if [ "$release_mode" != retry ]; then
                printf 'Tag %s already exists\n' "$tag" >&2
                exit 1
              fi
              printf 'Tag %s already exists; retry will check its GitHub Release\n' "$tag"
            fi
          done < <(jq -r '.packages[] | [.name, .nextVersion, .tag] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Build release packages
        if: steps.plan.outputs.has-release == 'true'
        run: pnpm build
      - name: Publish packages
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          while IFS=$'\t' read -r package version; do
            if pnpm view "$package@$version" version >/dev/null 2>&1; then
              if [ "$release_mode" != retry ]; then
                printf '%s@%s is already published\n' "$package" "$version" >&2
                exit 1
              fi
              printf 'Skipping already-published %s@%s\n' "$package" "$version"
              continue
            fi
            pnpm --filter "$package" publish --access public --no-git-checks --provenance
          done < <(jq -r '.packages[] | [.name, .nextVersion] | @tsv' "$RUNNER_TEMP/release-plan.json")
      - name: Tag published packages
        if: steps.plan.outputs.has-release == 'true'
        run: |
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          release_sha="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while IFS= read -r tag; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              if [ "$release_mode" != retry ]; then
                printf 'Tag %s already exists\n' "$tag" >&2
                exit 1
              fi
              tag_commit="$(git ls-remote origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')"
              if [ "$tag_commit" != "$release_sha" ]; then
                printf 'Tag %s points to %s, not release commit %s\n' "$tag" "$tag_commit" "$release_sha" >&2
                exit 1
              fi
              printf 'Skipping existing tag %s\n' "$tag"
              continue
            fi
            git tag --annotate "$tag" "$release_sha" --message "Release $tag"
            git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$tag"
          done < <(jq -r '.packages[].tag' "$RUNNER_TEMP/release-plan.json")
        env:
          RELEASE_TOKEN: ${{ steps.release_app_token.outputs.token }}
      - name: Create GitHub Release
        if: steps.plan.outputs.has-release == 'true'
        run: |
          first_tag="$(jq -r '.packages[0].tag' "$RUNNER_TEMP/release-plan.json")"
          package="$(jq -r '.packages[0].name' "$RUNNER_TEMP/release-plan.json")"
          release_mode="$(jq -r '.mode' "$RUNNER_TEMP/release-plan.json")"
          if gh release view "$first_tag" >/dev/null 2>&1; then
            if [ "$release_mode" != retry ]; then
              printf 'GitHub Release %s already exists\n' "$first_tag" >&2
              exit 1
            fi
            printf 'Skipping existing GitHub Release %s\n' "$first_tag"
            exit 0
          fi
          git fetch --tags origin
          jq -r '"## Published packages\n\n" + (.packages | map("- `\(.name)@\(.nextVersion)` ([tag](https://github.com/" + env.GITHUB_REPOSITORY + "/releases/tag/" + .tag + "))") | join("\n"))' "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/release-notes.md"
          previous_tag="$(git tag --list "$package@*" --sort=-v:refname | grep -Fvx "$first_tag" | head -n 1 || true)"
          if [ -z "$previous_tag" ] && git rev-parse --verify --quiet refs/tags/release-baseline >/dev/null; then
            previous_tag=release-baseline
          fi
          release_sha="$(git rev-parse HEAD)"
          if [ -n "$previous_tag" ]; then
            printf '\n## Changes since `%s`\n\n' "$previous_tag" >> "$RUNNER_TEMP/release-notes.md"
            commit_range="$previous_tag..$release_sha"
          else
            printf '\n## Changes\n\n' >> "$RUNNER_TEMP/release-notes.md"
            commit_range="$release_sha"
          fi
          commit_count=0
          while IFS=$'\t' read -r commit subject; do
            printf -- '- [`%.7s`](https://github.com/%s/commit/%s) %s\n' "$commit" "$GITHUB_REPOSITORY" "$commit" "$subject" >> "$RUNNER_TEMP/release-notes.md"
            commit_count=$((commit_count + 1))
          done < <(git log --first-parent --format='%H%x09%s' "$commit_range")
          if [ "$commit_count" -eq 0 ]; then
            printf '%s\n' '- No commits were merged in this release range.' >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$first_tag" --title "Release $first_tag" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
