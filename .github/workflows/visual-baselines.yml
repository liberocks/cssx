name: Refresh visual baselines

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'

permissions:
  contents: read

jobs:
  refresh:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: node tests/scripts/install-framework-examples.mjs
      - if: runner.os == 'Linux'
        run: pnpm --dir tests exec playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: pnpm --dir tests exec playwright install chromium
      - run: pnpm --dir tests test:update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines-${{ matrix.os }}
          path: tests/**/*.png
          if-no-files-found: error
