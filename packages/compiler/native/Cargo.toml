[workspace]
resolver = "3"
members = ["crates/compiler-core", "crates/compiler-node"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_ast_visit = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_semantic = "=0.156.0"
oxc_span = "=0.156.0"
oxc_syntax = "=0.156.0"
napi = "3"
napi-build = "2"
napi-derive = "3"
lowdash = "=0.9.0"

